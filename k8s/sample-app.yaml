apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-api
  labels:
    app: bedrock-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bedrock-api
  template:
    metadata:
      labels:
        app: bedrock-api
    spec:
      containers:
      - name: web-app
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bedrock-api-service
spec:
  type: LoadBalancer
  selector:
    app: bedrock-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80