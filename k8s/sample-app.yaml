apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-retail-ui
  labels:
    app: retail-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-ui
  template:
    metadata:
      labels:
        app: retail-ui
    spec:
      containers:
      - name: web-ui
        # Fixed: Corrected the repository name to 'retail-store-sample-ui' and updated tag to '1.2.1'
        image: public.ecr.aws/aws-containers/retail-store-sample-ui:1.2.1
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "v1.2.1"
        - name: DB_MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: bedrock-db-config
              key: MYSQL_HOST
        - name: DB_POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: bedrock-db-config
              key: POSTGRES_HOST
---
apiVersion: v1
kind: Service
metadata:
  name: bedrock-api-service
spec:
  type: LoadBalancer
  selector:
    app: retail-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080