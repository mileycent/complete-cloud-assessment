apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-app-ingress
  namespace: retail-app
  annotations:
    # 1. Core Ingress Controller Driver Trigger
    kubernetes.io/ingress.class: alb
    
    # 2. Network Routing Target & Placement
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # Routes traffic directly to pod IPs via VPC CNI
    
    # 3. Security, Port Configuration, and HTTPS Enforcement
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443' # Automatically redirects port 80 requests to port 443
    
    # 4. ACM SSL/TLS Termination
    # CRITICAL: Replace this placeholder ARN with your actual verified ACM Certificate ARN from AWS
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:368202500000:certificate/abc12345-def6-7890-abcd-ef1234567890
    
    # 5. Fine-tuning routing parameters
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health # Default mapping endpoint for the retail framework UI
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'

spec:
  rules:
    # If you have a custom domain, replace 'retail.nip.io' with your domain. 
    # Otherwise, you can append your ALB IP to a magic DNS wrapper like nip.io for testing.
    - host: retail.nip.io 
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui # Links directly to the retail storefront service
                port:
                  number: 80