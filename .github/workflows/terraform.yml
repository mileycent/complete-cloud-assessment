name: "Project Bedrock IaC Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Crucial requirement for AWS OIDC authentication
  contents: write # Allows pipeline to commit grading.json changes back to repo

jobs:
  terraform:
    name: "Automate Infrastructure"
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down a copy of your codebase into the runner
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # 2. Authenticate to AWS securely via OIDC token swap
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      # 3. Provision the specific Terraform binary environment
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # 4. Check if your code formatting matches standards (Fails if messy)
      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      # 5. Initialize working backend configurations cleanly
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      # 6. Run an architecture execution simulation (Dry run)
      - name: Terraform Plan
        run: terraform plan -input=false
        working-directory: ./terraform

      # 7. Execute live physical architecture provisioning (Only on Main push merges)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform